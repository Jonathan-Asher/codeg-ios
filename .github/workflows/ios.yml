name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Archive and upload to TestFlight (needs the TESTFLIGHT_ENABLED variable and the ASC_* secrets)
        type: boolean
        default: false
      build_number:
        description: Build number (CURRENT_PROJECT_VERSION) for the upload; defaults to the run number
        type: string
        required: false
      tests:
        description: "auto: skip the build and test jobs when a push run for this commit passed or is still running. run: always run them"
        type: choice
        options:
          - auto
          - run
        default: auto

permissions:
  contents: read

jobs:
  # A manual run (usually a TestFlight upload) for a commit whose push run has
  # passed, or is still running, does not build and test that commit again.
  # Anything unexpected (no push run, a failed or cancelled one, an API error)
  # means the build and test jobs run.
  prior:
    name: Prior push run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.find.outputs.skip }}
      watch: ${{ steps.find.outputs.watch }}
    steps:
      - name: Find the push run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ inputs.tests }}
        run: |
          skip=false watch=""
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          runs_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs"
          if [[ "$TESTS" == run ]]; then
            say "tests=run: the build and test jobs run."
          elif ! runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | {id, status, conclusion}]")"; then
            say "Could not look up the push runs of $GITHUB_SHA: the build and test jobs run."
          else
            passed="$(jq -r 'map(select(.status == "completed" and .conclusion == "success")) | first | .id // empty' <<<"$runs" || true)"
            running="$(jq -r 'map(select(.status != "completed")) | first | .id // empty' <<<"$runs" || true)"
            if [[ "$passed" =~ ^[0-9]+$ ]]; then
              skip=true
              say "The push run $runs_url/$passed passed for $GITHUB_SHA: the build and test jobs are skipped."
            elif [[ "$running" =~ ^[0-9]+$ ]]; then
              skip=true watch="$running"
              say "The push run $runs_url/$running is still running for $GITHUB_SHA: the build and test jobs are skipped, and \"Push run result\" waits for it."
            else
              say "No push run of $GITHUB_SHA passed or is running: the build and test jobs run."
            fi
          fi
          echo "skip=$skip" >>"$GITHUB_OUTPUT"
          echo "watch=$watch" >>"$GITHUB_OUTPUT"

  # Keeps a manual run's colour honest when it skipped the tests for a push run
  # that had not finished: it ends as that push run ends.
  push-result:
    name: Push run result
    needs: prior
    if: needs.prior.outputs.watch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for the push run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.prior.outputs.watch }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          echo "Waiting for $url"
          cancelled_at=""
          while :; do
            if ! state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '"\(.status) \(.conclusion // "none") \(.run_attempt)"')"; then
              sleep 30; continue
            fi
            read -r status conclusion attempt <<<"$state"
            if [[ "$status" != completed ]]; then cancelled_at=""; sleep 30; continue; fi
            # When the Mac goes away, the runner guard moves a run that waits
            # for it to GitHub's runners by cancelling it and running it again:
            # give a cancelled run five minutes to start its next attempt.
            if [[ "$conclusion" == cancelled ]]; then
              now="$(date +%s)"; cancelled_at="${cancelled_at:-$now}"
              if (( now - cancelled_at < 300 )); then sleep 30; continue; fi
            fi
            break
          done
          if [[ "$conclusion" == success ]]; then
            echo "The push run passed (attempt $attempt): $url"
          else
            echo "::error::The push run of this commit ended '$conclusion' (attempt $attempt): $url. Run this workflow again with tests=run to build and test here."
            exit 1
          fi

  build:
    name: Simulator build
    needs: prior
    if: ${{ !cancelled() && needs.prior.outputs.skip != 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: ios-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      # SwiftTerm ships a Metal shader; Xcode 26+ installs the Metal compiler
      # as a separate component.
      - name: Ensure the Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          fmt=cat
          if command -v xcbeautify >/dev/null 2>&1; then fmt="xcbeautify --renderer github-actions"; fi
          xcodebuild build \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | $fmt

      - name: Check the app identity
        run: scripts/check-app-identity.sh build/DerivedData/Build/Products/Debug-iphonesimulator/Codeg.app

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

  # The app as it links for an iPhone (Release, arm64, unsigned): proves the
  # device link and checks the binary carries one ONNX Runtime and one
  # espeak-ng, with sherpa-onnx using BlueTTSKit's runtime.
  device:
    name: Device build
    needs: prior
    if: ${{ !cancelled() && needs.prior.outputs.skip != 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ios-device-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure the Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for an iPhone
        run: |
          set -o pipefail
          fmt=cat
          if command -v xcbeautify >/dev/null 2>&1; then fmt="xcbeautify --renderer github-actions"; fi
          xcodebuild build \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-device.log" | $fmt

      - name: Check the linked binary for a second ONNX Runtime or espeak-ng
        run: scripts/check-linked-symbols.sh build/DerivedData/Build/Products/Release-iphoneos/Codeg.app/Codeg

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-device-log
          path: ${{ runner.temp }}/xcodebuild-device.log
          retention-days: 7

  test:
    name: Unit tests
    needs: prior
    if: ${{ !cancelled() && needs.prior.outputs.skip != 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: ios-test-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure the Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Generate the Xcode project
        run: xcodegen generate

      # The list screenshots are taken at the simulator's screen size, so an
      # iPhone 17 Pro Max (Jonathan's phone) is preferred when the runtime has one.
      - name: Pick an iPhone simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(key):
              m = re.search(r"iOS-(\d+)-(\d+)", key)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          runtimes = sorted((k for k in devices if "iOS" in k), key=version, reverse=True)
          picked = None
          for key in runtimes:
              phones = [d for d in devices[key] if d["name"].startswith("iPhone")]
              preferred = [d for d in phones if d["name"] == "iPhone 17 Pro Max"]
              if preferred:
                  picked = preferred[0]; break
              if phones and picked is None:
                  picked = phones[0]
          if picked:
              print(picked["udid"])
          ')"
          if [[ -z "$udid" ]]; then echo "::error::no iPhone simulator available"; exit 1; fi
          echo "SIM_UDID=$udid" >>"$GITHUB_ENV"
          xcrun simctl list devices available | grep "$udid"

      - name: Run the unit tests
        run: |
          set -o pipefail
          # Forwarded to the tests as LIST_SHOTS_DIR (the list screenshots).
          export TEST_RUNNER_LIST_SHOTS_DIR="$PWD/build/list-shots"
          # And as COMPOSE_SHOTS_DIR (the compose area in each dictation state).
          export TEST_RUNNER_COMPOSE_SHOTS_DIR="$PWD/build/compose-shots"
          fmt=cat
          if command -v xcbeautify >/dev/null 2>&1; then fmt="xcbeautify --renderer github-actions"; fi
          xcodebuild test \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log" | $fmt

      - name: Upload the session list screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-list-screenshots
          path: build/list-shots
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the compose area screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-screenshots
          path: build/compose-shots
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: ${{ runner.temp }}/xcodebuild-test.log
          retention-days: 7

  # Manual only. Disabled until the repository variable TESTFLIGHT_ENABLED is
  # set to "true", which should happen once the ASC_KEY_ID, ASC_ISSUER_ID and
  # ASC_KEY_P8 secrets exist (see docs/FORK.md). Starts once the simulator
  # build passed, or straight away when `prior` skipped the build for a push
  # run of the same commit; the archive itself checks the app identity.
  testflight:
    name: TestFlight upload
    needs: [prior, build]
    if: >-
      ${{
        !cancelled()
        && github.event_name == 'workflow_dispatch' && inputs.testflight && vars.TESTFLIGHT_ENABLED == 'true'
        && (needs.build.result == 'success'
            || (needs.build.result == 'skipped' && needs.prior.result == 'success'))
      }}
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [[ -n "$ASC_KEY_ID" ]] || missing+=" ASC_KEY_ID"
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=" ASC_ISSUER_ID"
          [[ -n "$ASC_KEY_P8" ]] || missing+=" ASC_KEY_P8"
          if [[ -n "$missing" ]]; then echo "::error::missing secrets:$missing"; exit 1; fi
          keydir="$HOME/.appstoreconnect/private_keys"
          key="$keydir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$keydir"
          # Accept the .p8 contents as-is, or base64-encoded.
          if grep -q 'BEGIN PRIVATE KEY' <<<"$ASC_KEY_P8"; then
            printf '%s\n' "$ASC_KEY_P8" >"$key"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode >"$key"
          fi
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >>"$GITHUB_ENV"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure the Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Generate the Xcode project
        run: xcodegen generate

      # A hosted runner starts with an empty keychain, so automatic signing
      # used to create a new development certificate on every upload until
      # the account hit Apple's limit. The archive now signs with one
      # long-lived certificate whose key is kept in the repository secrets.
      - name: Install the signing certificate
        env:
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          missing=""
          [[ -n "$IOS_DEV_CERT_P12" ]] || missing+=" IOS_DEV_CERT_P12"
          [[ -n "$IOS_DEV_CERT_PASSWORD" ]] || missing+=" IOS_DEV_CERT_PASSWORD"
          [[ -n "$IOS_KEYCHAIN_PASSWORD" ]] || missing+=" IOS_KEYCHAIN_PASSWORD"
          if [[ -n "$missing" ]]; then echo "::error::missing secrets:$missing"; exit 1; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          p12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_DEV_CERT_P12" | base64 --decode >"$p12"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$IOS_DEV_CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Archive, export and upload
        env:
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: scripts/archive.sh --tag "ci-${{ github.run_number }}" --build-number "$BUILD_NUMBER"

      # Every upload keeps its dSYMs, so the crash reports the app sends to
      # the codeg server (and TestFlight's) can be symbolicated later. The box
      # pulls this artifact into ~/codeg-e2e/dsyms/<version>-<build>/ (see
      # docs/FORK.md, "Crash reports").
      - name: Collect the dSYMs
        id: dsyms
        env:
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)"
          archive="build/CodegiOS-ci-${{ github.run_number }}.xcarchive"
          if [[ ! -d "$archive/dSYMs/Codeg.app.dSYM" ]]; then echo "::error::no Codeg.app.dSYM in $archive"; exit 1; fi
          out="build/dsyms"
          mkdir -p "$out"
          for d in "$archive"/dSYMs/*.dSYM; do
            ditto -c -k --keepParent "$d" "$out/$(basename "$d").zip"
            dwarfdump --uuid "$d" | tee -a "$out/uuids.txt"
          done
          printf 'version=%s\nbuild=%s\nrun=%s\ncommit=%s\n' "$version" "$BUILD_NUMBER" \
            "${{ github.run_id }}" "${{ github.sha }}" >"$out/build-info.txt"
          du -sh "$out"/*
          echo "name=dsyms-$version-$BUILD_NUMBER" >>"$GITHUB_OUTPUT"

      - name: Upload the dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dsyms.outputs.name }}
          path: build/dsyms
          if-no-files-found: error
          # The longest a public repository keeps an artifact.
          retention-days: 90

      # Safety net: should signing ever mint a development certificate again
      # (it reaches the account's limit after a handful of runs), revoke every
      # API-created one except the long-lived certificate above.
      - name: Revoke stray development certificates
        if: always() && env.ASC_KEY_PATH != ''
        env:
          KEEP_CERT_ID: ${{ vars.IOS_DEV_CERT_ID }}
        run: |
          if [[ -z "$KEEP_CERT_ID" ]]; then echo "::warning::IOS_DEV_CERT_ID is not set; skipping"; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/revoke_stray_certs.py

      - name: Remove the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
