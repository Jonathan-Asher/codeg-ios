name: CodegiOS
options:
  bundleIdPrefix: io.ashurov
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

# Base.xcconfig pulls in Identity.xcconfig (bundle id, display name, URL
# scheme — the one place to rename the app) and Signing.xcconfig (team).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  # Native VT100/xterm terminal emulator (the equivalent of the web client's
  # xterm.js) — backs the folder detail's Terminal tab. First SPM dependency in
  # the project; resolved over the network on the first build.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Exact pin: CodegiOS.xcodeproj (and its Package.resolved) is git-ignored and
    # regenerated by xcodegen, so a range would let fresh checkouts resolve a
    # different SwiftTerm. Bump deliberately.
    exactVersion: "1.13.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The team comes from Config/Signing.xcconfig (overridable through
    # Config/Signing.local.xcconfig or the CODEG_DEVELOPMENT_TEAM xcodebuild
    # setting). Simulator builds need no signing at all.
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  CodegiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CodegiOS
    dependencies:
      - package: SwiftTerm
    # Generated by xcodegen from these properties. `aps-environment` stays
    # `development` here: exporting an archive for App Store Connect re-signs
    # with the distribution profile, which turns it into `production` for
    # TestFlight / App Store builds.
    entitlements:
      path: CodegiOS/CodegiOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CODEG_BUNDLE_ID)
        PRODUCT_NAME: Codeg
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
        # App icon lives in Assets.xcassets/AppIcon.appiconset (single-size 1024 universal).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No fixed status-bar style: let it follow the active color scheme (dark
        # content on light backgrounds, light content on dark) so Light mode is legible.
    info:
      path: CodegiOS/Info.plist
      properties:
        # Name and URL scheme come from Config/Identity.xcconfig.
        CFBundleDisplayName: "$(CODEG_DISPLAY_NAME)"
        # Read by AppIdentity.urlScheme so deep-link parsing follows the
        # registered scheme.
        CodegURLScheme: "$(CODEG_URL_SCHEME)"
        # Only standard HTTPS/TLS from the OS is used, so no export-compliance
        # documentation is needed for each upload.
        ITSAppUsesNonExemptEncryption: false
        # Version is single-sourced from the MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # build settings above so `scripts/release.sh` only has to bump those two lines.
        # These MUST stay as $(...) references, not literals — a literal here overrides
        # the build setting and silently freezes the displayed version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # App-UI localizations. The String Catalog (Localizable.xcstrings) carries
        # the actual translations; this advertises them at runtime so an in-app
        # `.environment(\.locale, …)` override (the Language picker) can resolve
        # zh-Hans even when the device language is English.
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes:
              - "$(CODEG_URL_SCHEME)"
        UILaunchScreen: {}
        UIUserInterfaceStyleSupportsDark: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "$(CODEG_DISPLAY_NAME) connects to your codeg server, which may run on your local network."
        NSPhotoLibraryUsageDescription: "$(CODEG_DISPLAY_NAME) attaches photos you pick to your message to the agent."
        NSCameraUsageDescription: "$(CODEG_DISPLAY_NAME) uses the camera to take photos for your messages and to scan a server's QR code."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
